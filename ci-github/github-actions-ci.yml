name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default; the image job asks for exactly what it uses.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Every action is pinned to a commit SHA: a tag can be repointed by
      # whoever controls the action's repository, and this workflow holds a
      # token that can publish the image that receives the cluster CA key.
      # Dependabot (.github/dependabot.yml) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26'}
      - run: go vet ./...
      # Replays protocol contracts captured from real rke2 servers.
      # No cluster or VM required. See docs/compatibility.md.
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  image:
    needs: test
    # main -> image tagged with the commit SHA only.
    # vX.Y.Z tag -> image tagged X.Y.Z only (what the chart's appVersion names).
    # Nothing ever publishes "latest": a moving tag on the image that holds the
    # cluster CA key would let one push change every cluster that pulls it.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing and provenance (GitHub OIDC)
      attestations: write  # store the SLSA provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26'}
      # KO_DOCKER_REPO must NOT be set at job level: setup-ko only logs in to
      # ghcr.io when it is unset. The ko version is explicit so a new ko
      # release cannot change the build without a reviewed commit.
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with: {version: v0.19.1}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.0.6}

      - name: Choose the image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            # Refuse anything that is not semver rather than publish an
            # unexpected tag the chart cannot name.
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"
              exit 1
            fi
          else
            tag="$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ko cross-compiles Go natively, so arm64 is built at full speed rather
      # than emulated under QEMU. Base image and -trimpath come from .ko.yaml.
      - name: Build and push
        id: build
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/rke2-supervisor-shim
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ko build ./cmd/shim --platform=linux/amd64,linux/arm64 --bare \
            --tags="$TAG" --image-refs=image-refs.txt
          cat image-refs.txt
          # The multi-arch index is the last reference ko reports.
          digest=$(tail -n1 image-refs.txt | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p')
          if [ -z "$digest" ]; then echo "::error::no digest in image-refs.txt"; exit 1; fi
          echo "name=$KO_DOCKER_REPO" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: the signature binds the digest to this workflow's OIDC
      # identity, recorded in Rekor. Verify with
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp '^https://github.com/samr037/rke2-supervisor-shim/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # Signing by digest, never by tag, so what is signed cannot drift.
      - name: Sign
        env:
          IMAGE: ${{ steps.build.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # SLSA build provenance, pushed next to the image. Verify with
      #   gh attestation verify oci://<image>@<digest> --repo samr037/rke2-supervisor-shim
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
