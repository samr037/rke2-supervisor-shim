{{- if include "shim.secretsAdmissionPolicy.enabled" . }}
# The node-passwords Role must grant create/patch on every Secret in
# kube-system, because RBAC cannot match a name suffix and resourceNames cannot
# cover names that do not exist yet. Without this policy a compromised shim
# token could overwrite any kube-system Secret (bootstrap tokens, other
# controllers' credentials). With it, the shim's ServiceAccount can only write
# <node>.node-password.rke2, and can never change a stored password hash -
# re-pointing an existing node's hash is exactly the node impersonation the
# node password exists to prevent.
#
# Reads (get/list) are NOT covered: admission never sees them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "shim.name" . }}-node-password-secrets
  labels: {{- include "shim.labels" . | nindent 4 }}
spec:
  # Fail closed: if the policy cannot be evaluated the write is refused. The
  # shim treats a failed write as a failed join, which is the safe direction.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        # A PATCH reaches admission as UPDATE.
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    # Scoped to the shim alone; every other client, including a real rke2
    # server during adoption, is unaffected.
    - name: is-shim-serviceaccount
      expression: >-
        request.userInfo.username ==
        "system:serviceaccount:{{ include "shim.namespace" . }}:{{ include "shim.serviceAccountName" . }}"
  validations:
    - expression: object.metadata.name.endsWith(".node-password.rke2")
      message: rke2-supervisor-shim may only write Secrets named <node>.node-password.rke2
      reason: Forbidden
    - expression: >-
        request.operation != "UPDATE" ||
        (has(object.data) == has(oldObject.data) &&
         (!has(object.data) || object.data == oldObject.data))
      message: rke2-supervisor-shim may annotate a node-password Secret but never change its data
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "shim.name" . }}-node-password-secrets
  labels: {{- include "shim.labels" . | nindent 4 }}
spec:
  policyName: {{ include "shim.name" . }}-node-password-secrets
  validationActions: [Deny]
{{- end }}
{{- if include "shim.nodesAdmissionPolicy.enabled" . }}
---
# Every token holder can get a system:rke2-controller certificate (the endpoint
# takes no node headers, exactly as on a real rke2 server), and the agent needs
# patch on nodes to label its own Node. The identity is shared by every agent,
# so RBAC cannot say "your own node": without this policy a stolen join token
# could re-taint or cordon any node, or stamp a control-plane role label on a
# node it controls and attract workloads that select for it. The policy keeps
# what the agent needs (ordinary labels and annotations) and freezes the rest.
#
# nodes/status is not matched: what the agent writes there has not been
# captured, and refusing it blind could break joins. That gap is documented.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "shim.name" . }}-rke2-controller-nodes
  labels: {{- include "shim.labels" . | nindent 4 }}
spec:
  # Fail closed: a refused node update shows up as a 403 in the agent log, which
  # is loud, rather than as a silently re-tainted control plane.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        # A PATCH reaches admission as UPDATE.
        operations: ["UPDATE"]
        resources: ["nodes"]
  matchConditions:
    - name: is-rke2-controller
      expression: request.userInfo.username == "system:rke2-controller"
  variables:
    - name: newLabels
      expression: object.metadata.?labels.orValue({})
    - name: oldLabels
      expression: oldObject.metadata.?labels.orValue({})
  validations:
    - expression: object.spec == oldObject.spec
      message: >-
        system:rke2-controller may change node labels and annotations only,
        never the spec (taints, unschedulable, podCIDR, providerID)
      reason: Forbidden
    - expression: >-
        variables.newLabels.all(k,
          !(k.startsWith("node-role.kubernetes.io/") || k.startsWith("node-restriction.kubernetes.io/")) ||
          (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k])) &&
        variables.oldLabels.all(k,
          !(k.startsWith("node-role.kubernetes.io/") || k.startsWith("node-restriction.kubernetes.io/")) ||
          k in variables.newLabels)
      message: >-
        system:rke2-controller may not add, change or remove node-role.kubernetes.io/*
        or node-restriction.kubernetes.io/* labels
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "shim.name" . }}-rke2-controller-nodes
  labels: {{- include "shim.labels" . | nindent 4 }}
spec:
  policyName: {{ include "shim.name" . }}-rke2-controller-nodes
  validationActions: [Deny]
{{- end }}
