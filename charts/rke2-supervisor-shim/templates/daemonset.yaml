{{- if and (not .Values.agentConfig.existingConfigMap) (not .Values.agentConfig.contents) }}
{{- fail "agentConfig: set either existingConfigMap or contents (--set-file agentConfig.contents=<captured /v1-rke2/config>). See docs/compatibility.md." }}
{{- end }}
{{- if .Values.agentConfig.contents }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shim.agentConfigMap" . }}
  namespace: {{ include "shim.namespace" . }}
  labels: {{- include "shim.labels" . | nindent 4 }}
data:
  agent-config.json: |
{{ .Values.agentConfig.contents | indent 4 }}
---
{{- end }}
# A DaemonSet, not a Deployment: rke2 assumes a supervisor is co-located with
# EVERY apiserver. Agents take the address list from /v1-rke2/apiservers and
# dial each of them on :9345 for the tunnel, so every control-plane node must
# run a shim. One replica works with a single CP and breaks on the second.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "shim.name" . }}
  namespace: {{ include "shim.namespace" . }}
  labels: {{- include "shim.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "shim.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "shim.labels" . | nindent 8 }}
        {{- include "shim.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart when the served agent config changes.
        checksum/agent-config: {{ .Values.agentConfig.contents | default .Values.agentConfig.existingConfigMap | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "shim.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # The image runs as nonroot (65532); Secret volumes are root-owned, so
      # without fsGroup the CA files are unreadable. runAsGroup pins the
      # primary GID too, so nothing depends on the image's /etc/group.
      # RuntimeDefault seccomp: hostNetwork already shares the node's network
      # stack, so the syscall surface is the cheapest thing left to cut.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # Mandatory: agents dial <apiserver-ip>:9345, so the supervisor must
      # listen on the control-plane node's own address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: shim
          image: {{ include "shim.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:{{ .Values.supervisorPort }}
            {{- if .Values.cluster.apiServers }}
            - --apiservers={{ join "," .Values.cluster.apiServers }}
            {{- else }}
            # no --apiservers: control-plane nodes are discovered and refreshed
            - --apiserver-port={{ .Values.cluster.apiServerPort }}
            {{- end }}
            - --cluster-dns={{ .Values.cluster.clusterDNS }}
            - --cluster-domain={{ .Values.cluster.clusterDomain }}
            - --pod-cidr={{ .Values.cluster.podCIDR }}
            - --service-cidr={{ .Values.cluster.serviceCIDR }}
            {{- if .Values.metrics.enabled }}
            - --metrics-listen=:{{ .Values.metrics.port }}
            {{- else }}
            # Omitting the flag would fall back to the default port on every
            # address; an empty value turns the listener off.
            - --metrics-listen=
            {{- end }}
            - --tunnel={{ .Values.tunnel.enabled }}
            # A file, not SHIM_TOKEN: environment variables are readable via
            # /proc/<pid>/environ and get copied into crash reports and debug
            # dumps; a 0440 file is readable by the shim's group only.
            - --token-file=/var/run/secrets/rke2-shim/token
            {{- if and .Values.servingCert.certFile .Values.servingCert.keyFile }}
            - --tls-cert=/pki/{{ .Values.servingCert.certFile }}
            - --tls-key=/pki/{{ .Values.servingCert.keyFile }}
            {{- end }}
            {{- with .Values.servingCert.extraSANs }}
            - --extra-sans={{ join "," . }}
            {{- end }}
          env:
            # SANs for the self-managed serving certificate
            - {name: NODE_IP,   valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          ports:
            - {name: supervisor, containerPort: {{ .Values.supervisorPort }}, protocol: TCP}
            {{- if .Values.metrics.enabled }}
            - {name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP}
            {{- end }}
          volumeMounts:
            - {name: pki, mountPath: /pki, readOnly: true}
            - {name: agent-config, mountPath: /etc/rke2-shim, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/rke2-shim, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          # Probes target the supervisor port, never metrics: with
          # metrics.enabled=false the metrics listener is on loopback, and a
          # hostNetwork pod's probes come from the kubelet to the node address.
          # Readiness is an HTTPS GET of /cacerts - unauthenticated by design,
          # so it proves the TLS listener and serving certificate actually work
          # without the probe holding a credential. (The kubelet does not verify
          # the certificate for HTTPS probes.)
          readinessProbe:
            httpGet: {path: /cacerts, port: {{ .Values.supervisorPort }}, scheme: HTTPS}
            initialDelaySeconds: 3
            periodSeconds: 10
          # Readiness is what gates the RollingUpdate (agents dial node
          # addresses, not a Service). Liveness stays a plain TCP connect so a
          # TLS or certificate fault halts a rollout instead of restart-looping
          # every control plane at once.
          livenessProbe:
            tcpSocket: {port: {{ .Values.supervisorPort }}}
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # cluster-ca.crt/.key: the CA that signs agent certificates. Created out
        # of band - a chart is committed, a private key must not be.
        - {name: pki, secret: {secretName: {{ .Values.pki.existingSecret }}, defaultMode: 0440}}
        - {name: agent-config, configMap: {name: {{ include "shim.agentConfigMap" . }}}}
        # Only the one key is projected, under a fixed file name, so whatever
        # else lives in that Secret never lands in the container.
        - name: token
          secret:
            secretName: {{ .Values.token.existingSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.token.key | quote }}, path: token}
