# Narrows what deploy/shim.yaml's ServiceAccount can WRITE in kube-system.
#
# Requires Kubernetes >= 1.30 (admissionregistration.k8s.io/v1
# ValidatingAdmissionPolicy). The chart renders the same policy automatically
# when the cluster supports it (secretsAdmissionPolicy.enabled=auto).
#
# Why: the rke2-shim-node-passwords Role must grant create/patch on every
# Secret in kube-system - RBAC cannot match a name suffix, and resourceNames
# cannot cover names that do not exist yet. Without this policy a stolen shim
# ServiceAccount token could overwrite any kube-system Secret, or mint a
# bootstrap-token Secret. With it, the shim can only write
# <node>.node-password.rke2, and can never change a stored password hash:
# re-pointing an existing node's hash is exactly the node impersonation the
# node password exists to prevent.
#
# Reads (get/list) are NOT covered; admission never sees them.
#
# If you changed the namespace or ServiceAccount name in deploy/shim.yaml,
# change the username in matchConditions to match.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rke2-shim-node-password-secrets
spec:
  # Fail closed: the shim treats a refused write as a failed join, which is
  # the safe direction.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        # A PATCH reaches admission as UPDATE.
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    # Scoped to the shim alone; every other client, including a real rke2
    # server during adoption, is unaffected.
    - name: is-shim-serviceaccount
      expression: request.userInfo.username == "system:serviceaccount:rke2-shim:rke2-shim"
  validations:
    - expression: object.metadata.name.endsWith(".node-password.rke2")
      message: rke2-supervisor-shim may only write Secrets named <node>.node-password.rke2
      reason: Forbidden
    - expression: >-
        request.operation != "UPDATE" ||
        (has(object.data) == has(oldObject.data) &&
         (!has(object.data) || object.data == oldObject.data))
      message: rke2-supervisor-shim may annotate a node-password Secret but never change its data
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rke2-shim-node-password-secrets
spec:
  policyName: rke2-shim-node-password-secrets
  validationActions: [Deny]
