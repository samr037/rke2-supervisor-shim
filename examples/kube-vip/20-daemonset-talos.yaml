apiVersion: apps/v1
kind: DaemonSet
metadata: {name: kube-vip-talos, namespace: kube-system}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kube-vip-talos}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kube-vip-talos}}
    spec:
      hostNetwork: true
      serviceAccountName: kube-vip
      # "true" == RKE2 control planes only. Talos uses "" for the same label,
      # so this is what keeps the VIP off the Talos apiservers during coexistence.
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations:
        - {operator: Exists, effect: NoSchedule}
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.9.0
          imagePullPolicy: IfNotPresent
          args: [manager]
          env:
            # Talk to the LOCAL apiserver, not the ClusterIP: the thing that
            # provides the API VIP must not depend on service routing.
            - {name: KUBERNETES_SERVICE_HOST, value: "127.0.0.1"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - {name: vip_interface,      value: "ens18"}
            - {name: address,            value: "<VIP>"}
            - {name: port,               value: "6443"}
            - {name: vip_subnet,         value: "32"}
            - {name: cp_enable,          value: "true"}
            - {name: svc_enable,         value: "false"}
            - {name: vip_arp,            value: "true"}
            - {name: vip_leaderelection, value: "true"}
            - {name: vip_leasename,      value: "plndr-cp-lock"}
            - {name: vip_leaseduration,  value: "15"}
            - {name: vip_renewdeadline,  value: "10"}
            - {name: vip_retryperiod,    value: "2"}
          securityContext:
            capabilities: {add: [NET_ADMIN, NET_RAW, SYS_TIME]}
