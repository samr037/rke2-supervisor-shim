stages: [test, build, conformance]

variables:
  IMAGE: $CI_REGISTRY_IMAGE

# ---------------------------------------------------------------------------
# Tier 1 - runs on every commit. No VM, no privileged runner.
# Replays the contracts captured from real rke2 servers against our handlers.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: golang:1.26
  script:
    - go vet ./...
    - go test -race -v ./...
  cache:
    key: gomod
    paths: [.go/pkg/mod]
  variables:
    GOPATH: $CI_PROJECT_DIR/.go

# Multi-arch image (amd64 + arm64) pushed to the project registry.
#
# ko rather than buildx/kaniko:
#   - buildx needs a privileged dind service, which the shared runner does not
#     provide (the job hangs forever on `docker info`);
#   - kaniko only produces a single architecture;
#   - ko is daemonless and cross-compiles Go natively, so arm64 is built at full
#     speed instead of under QEMU emulation.
#
# The Dockerfile is kept for local/offline builds; ko reproduces it (static
# binary on distroless nonroot) without needing a Docker daemon.
build:
  stage: build
  image: golang:1.26
  variables:
    KO_DOCKER_REPO: $CI_REGISTRY_IMAGE
    GOFLAGS: -trimpath
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: gomod
    paths: [.go/pkg/mod]
  before_script:
    # An explicit ko version (verified against go.sum / the checksum database)
    # so a new ko release cannot change the build without a reviewed commit.
    # Keep in step with setup-ko's `version:` in .github/workflows/ci.yml.
    - go install github.com/google/ko@v0.19.1
    - export PATH="$GOPATH/bin:$PATH"
    # The registry credential is written owner-only.
    - umask 077 && mkdir -p ~/.docker
    - |
      umask 077
      cat > ~/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"auth":"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"}}}
      EOF
  script:
    # Default branch -> the commit SHA only. vX.Y.Z tag -> X.Y.Z only, which is
    # what the chart's appVersion names. Never "latest": a moving tag on the
    # image that holds the cluster CA key would let one push (or one tag
    # pipeline) change what every cluster pulls next.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="${CI_COMMIT_TAG#v}"
      else
        TAGS="$CI_COMMIT_SHORT_SHA"
      fi
      echo "publishing tag: $TAGS"
    # Base image digest and -trimpath come from .ko.yaml.
    - ko build ./cmd/shim
        --platform=linux/amd64,linux/arm64
        --bare
        --tags="$TAGS"
        --image-refs=image-refs.txt
    - cat image-refs.txt
  artifacts:
    paths: [image-refs.txt]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Only semver release tags publish; any other tag name would otherwise
    # become an image tag nobody reviewed.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/

# ---------------------------------------------------------------------------
# Tier 2 - drift detection against upstream RKE2.
#
# Needs a throwaway VM reachable over SSH (CONFORMANCE_SSH_TARGET) because it
# installs a real rke2 server. Scheduled nightly so that a protocol change
# shows up here, not in production. See docs/compatibility.md.
# ---------------------------------------------------------------------------
.conformance:
  stage: conformance
  image: debian:13
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client python3 git >/dev/null
    # umask 077 so the private key is never world-readable, not even between
    # the write and a later chmod.
    - umask 077 && mkdir -p ~/.ssh && printf '%s\n' "$CONFORMANCE_SSH_KEY" > ~/.ssh/id_rsa
    # Pin the conformance VM's host key instead of trusting whatever answers:
    # with StrictHostKeyChecking off, anyone able to intercept the connection
    # receives the SSH session and could feed back a forged "capture" that
    # then becomes the committed protocol contract. CONFORMANCE_KNOWN_HOSTS is
    # a protected CI variable holding `ssh-keyscan <vm>` output verified out
    # of band.
    - test -n "$CONFORMANCE_KNOWN_HOSTS" || { echo "CONFORMANCE_KNOWN_HOSTS is not set"; exit 1; }
    - umask 077 && printf '%s\n' "$CONFORMANCE_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - umask 077 && echo "StrictHostKeyChecking yes" > ~/.ssh/config
  script:
    - ./conformance/capture.sh "$RKE2_VERSION" "$CONFORMANCE_SSH_TARGET"
    - |
      if ! git diff --quiet conformance/testdata/; then
        echo "############################################################"
        echo "# RKE2 PROTOCOL DRIFT DETECTED for $RKE2_VERSION"
        echo "# Review the diff and update the shim before upgrading prod."
        echo "############################################################"
        git --no-pager diff conformance/testdata/
        exit 1
      fi
      echo "no drift for $RKE2_VERSION"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# One job per supported RKE2 minor. Add a row when you adopt a new version.
conformance:1.31:
  extends: .conformance
  variables: {RKE2_VERSION: "v1.31.8+rke2r1"}

conformance:1.35:
  extends: .conformance
  variables: {RKE2_VERSION: "v1.35.7+rke2r1"}
